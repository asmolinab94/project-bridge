<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Bridge</title>
<style>
@font-face { font-family: "DM Sans"; font-weight: 400 700; font-style: normal;
  src: url(data:font/ttf;base64,__FONT_DMSANS__) format("truetype"); }
@font-face { font-family: "Inter"; font-weight: 400 700; font-style: normal;
  src: url(data:font/ttf;base64,__FONT_INTER__) format("truetype"); }
:root {
  --ink: #101828; --muted: #475467; --faint: #5F6B7E; --line: #E4E7EC; --soft: #F4F6FA; --bg: #ECEFF5; --card: #FFFFFF;
  --accent: #4338CA; --accent-strong: #3730A3; --accent-soft: #EEEDFD; --accent-mid: #B4B0F0;
  --bad: #B42318; --bad-soft: #FEF0EE; --good: #067647; --good-soft: #E7F6EE;
  --night: #0E1526; --night-2: #1B2445; --night-text: #C3CADB; --night-faint: #A0AABF;
  --radius: 14px; --radius-sm: 8px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 4px 14px rgba(16, 24, 40, .06);
  --shadow-up: 0 2px 4px rgba(16, 24, 40, .06), 0 10px 24px rgba(16, 24, 40, .10);
  --head: "DM Sans", "Helvetica Neue", Arial, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
}
* { box-sizing: border-box; font-style: normal; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 13px/1.45 var(--body); }
h1, h2, h3, th, button, .tab { font-family: var(--head); font-weight: 700; }
b, strong { font-weight: 700; }
.num, td.num, th.num, .fn, .fu, .wamt { font-variant-numeric: tabular-nums; }

/* Header: a dark band with the identity, the five screens as tabs that open onto the page below */
header { background: linear-gradient(120deg, var(--night) 0%, var(--night-2) 100%); color: #FFFFFF;
  padding: 12px 24px 0; box-shadow: 0 1px 0 rgba(255, 255, 255, .04) inset; }
header .top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
header h1 { margin: 0; font-size: 20px; line-height: 1.2; letter-spacing: -.015em; color: #FFFFFF; }
header h1 .period { font: 500 15px var(--head); color: var(--night-text); margin-left: 10px; padding-left: 10px;
  border-left: 1px solid rgba(255, 255, 255, .22); }
header .line { margin: 2px 0 0; color: var(--night-text); font-size: 12px; }
header .meta { margin: 0; color: var(--night-faint); font-size: 11px; white-space: nowrap; }
nav { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 10px; }
nav .tabwrap { display: flex; align-items: center; border-radius: 10px 10px 0 0; transition: background .15s; }
nav .tabwrap:hover { background: rgba(255, 255, 255, .08); }
nav .tabwrap.on { background: var(--bg); }
.tab { background: transparent; color: var(--night-text); border: 0; border-radius: 10px 10px 0 0;
  padding: 8px 4px 9px 14px; font-size: 13px; cursor: pointer; }
.tab:hover { color: #FFFFFF; }
nav .tabwrap.on .tab { color: var(--ink); }
nav .tabwrap .i { margin-right: 10px; }
nav .tabwrap:not(.on) button.i { background: transparent; border-color: var(--night-faint); color: var(--night-text); }
nav .tabwrap:not(.on) button.i:hover, nav .tabwrap:not(.on) button.i[aria-expanded="true"] {
  background: #FFFFFF; border-color: #FFFFFF; color: var(--night); }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible, [role="button"]:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px; }
header button:focus-visible { outline-color: #FFFFFF; }
main { padding: 16px 24px 14px; }
footer { color: var(--faint); font-size: 11px; margin-top: 12px; }

/* Explanations: a small "i" opens one box at a time */
button.i { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; padding: 0;
  margin-left: 5px; border-radius: 50%; border: 1px solid var(--faint); background: var(--card); color: var(--muted);
  font: 700 10px/1 var(--head); cursor: pointer; vertical-align: 1px; flex: none; }
button.i:hover, button.i[aria-expanded="true"] { border-color: var(--accent); color: var(--card); background: var(--accent); }
th button.i { border-color: var(--faint); }
.tip { position: fixed; z-index: 50; max-width: 320px; background: var(--ink); color: #FFFFFF; padding: 9px 12px;
  border-radius: 8px; font: 400 12px/1.45 var(--body); box-shadow: 0 8px 24px rgba(15, 27, 45, .22); }

/* Cards, banners, headings */
.banner { border: 1px solid #F6CFC9; border-left: 4px solid var(--bad); background: var(--bad-soft); padding: 9px 14px;
  margin: 0 0 14px; border-radius: var(--radius-sm); box-shadow: var(--shadow); }
.banner.info { border: 1px solid var(--line); border-left: 4px solid var(--accent); background: var(--card); }
.cards { display: flex; flex-wrap: wrap; gap: 14px; margin: 0 0 18px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 18px;
  min-width: 190px; box-shadow: var(--shadow); }
.card .num { font: 700 26px/1.15 var(--head); letter-spacing: -.02em; display: block; }
.card .lab { color: var(--muted); font-size: 12px; }
h2 { font-size: 20px; letter-spacing: -.015em; margin: 4px 0 10px; display: flex; align-items: center; }
h3 { font-size: 14px; margin: 16px 0 8px; }
.lead { color: var(--muted); margin: 0 0 12px; max-width: 90ch; }
.muted { color: var(--muted); }

/* Controls */
.filters { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; background: var(--card);
  border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; margin: 0 0 10px; box-shadow: var(--shadow); }
.filters label { display: flex; flex-direction: column; font-size: 11px; font-weight: 600; color: var(--muted); gap: 3px; }
input, select { font: 400 13px var(--body); color: var(--ink); border: 1px solid #D0D5DD; border-radius: var(--radius-sm);
  padding: 6px 9px; background: var(--card); transition: border-color .15s, box-shadow .15s; }
input:hover, select:hover { border-color: var(--accent-mid); }
input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); outline: 0; }
input.w-sm { width: 100px; } input.w-md { width: 150px; }
button { background: var(--accent); color: #FFFFFF; border: 0; border-radius: var(--radius-sm); padding: 8px 14px; font-size: 12px;
  cursor: pointer; transition: background .15s, box-shadow .15s, color .15s; }
button:not(.link, .tab, .i, .ghost, .switch button) { box-shadow: 0 1px 2px rgba(16, 24, 40, .12); }
button:not(.link, .tab, .i, .ghost, .switch button):hover { background: var(--accent-strong); }
button.ghost { background: var(--card); color: var(--accent); border: 1px solid var(--accent-mid); }
button.ghost:hover { background: var(--accent-soft); }
.count { color: var(--muted); margin: 6px 0; }
.switch { display: inline-flex; gap: 2px; margin: 0 0 12px; padding: 3px; background: #E2E6EE; border-radius: 10px; }
.switch button { background: transparent; color: var(--muted); border: 0; border-radius: var(--radius-sm); box-shadow: none; }
.switch button:hover { background: rgba(255, 255, 255, .6); color: var(--ink); }
.switch button[aria-pressed="true"] { background: var(--card); color: var(--accent); box-shadow: 0 1px 3px rgba(16, 24, 40, .14); }
.notice { display: flex; gap: 10px; align-items: center; margin: 4px 0; }
.notice .gross { font-weight: 700; }

/* Tables */
.wrap { overflow: auto; max-height: calc(100vh - 230px); background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow); }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 12.5px; }
th { position: sticky; top: 0; z-index: 2; background: #F8F9FC; color: var(--muted); text-align: left;
  padding: 9px 12px; white-space: nowrap; font-size: 11px; letter-spacing: .02em; border-bottom: 1px solid var(--line);
  box-shadow: 0 1px 0 var(--line); }
td { padding: 7px 12px; border-bottom: 1px solid #F0F2F6; vertical-align: top; transition: background .12s; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: #F5F5FF; }
td.num, th.num { text-align: right; white-space: nowrap; }
td.key { font-size: 12px; word-break: break-all; min-width: 135px; }
tfoot td { position: sticky; bottom: 0; background: #F8F9FC; font-weight: 700; border-top: 1px solid var(--line);
  box-shadow: 0 -1px 0 var(--line); }
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap;
  color: var(--ink); background: var(--soft); box-shadow: inset 0 0 0 1px rgba(16, 24, 40, .06); }
.pill.real_error, .pill.fail { background: var(--bad-soft); color: var(--bad); }
.pill.timing { background: var(--accent-soft); color: var(--accent); }
.pill.data_issue, .pill.auto_cleared, .pill.neutral { background: var(--soft); color: var(--muted); }
.pill.pass { background: var(--good-soft); color: var(--good); }
td input, td select { width: 100%; min-width: 80px; }
td.note-c input { min-width: 110px; }
.summary { max-height: none; margin: 0 0 14px; }
td.typehead { background: var(--soft); padding: 6px 12px; } td.typehead button { font-size: 12.5px; }
tr.flag td { color: var(--faint); }
.summary table { width: auto; min-width: 60%; }
.summary tbody tr { cursor: pointer; }
.summary tbody tr.sub td { background: var(--soft); font-weight: 700; }
.summary tbody tr.on td { background: var(--accent-soft); }
.summary tbody tr.on td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.rows th { white-space: normal; }
.rows td.c-date { white-space: nowrap; }
.rows td.c-action { min-width: 190px; } .rows td.c-type { white-space: normal; min-width: 110px; }
.rows td.c-src { font-size: 12px; min-width: 130px; }
.rows td.c-fields .kv { display: inline-block; margin-right: 12px; }
.kv, .more { display: block; } .kv .k, .more { color: var(--muted); }
button.link { background: transparent; color: var(--accent); padding: 0; font: 400 12px var(--body); text-align: left;
  text-decoration: none; word-break: break-all; }
button.link:hover { text-decoration: underline; }
button.link.task { word-break: normal; overflow-wrap: normal; min-width: 150px; color: var(--ink); font-weight: 600; }
tr.srcrow td { background: #F8F9FC; padding: 6px 12px 12px 30px; box-shadow: inset 3px 0 0 var(--accent-mid); }
.srctable { width: auto; font-size: 12px; } .srctable td { border-bottom: 1px solid var(--line); background: transparent; }
.srctable td.c-src { white-space: nowrap; color: var(--muted); }
.srctable .kv { display: inline-block; margin-right: 12px; }
td.link, td.link-on { cursor: pointer; } td.link:hover { background: var(--accent-soft); color: var(--accent); }
.tie { margin: 4px 0; } .tie.bad { color: var(--bad); font-weight: 700; }

/* Summary: two status lines, one card per pair of records, the explained split below */
.strip { display: grid; grid-template-columns: 2.7fr 1fr; gap: 14px; margin: 0 0 14px; }
.status { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 14px 8px 16px;
  cursor: pointer; line-height: 1.35; font-size: 12px; box-shadow: var(--shadow); position: relative; overflow: hidden;
  transition: box-shadow .15s, transform .15s, border-color .15s; }
.status::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--ink); }
.status:hover { border-color: var(--accent-mid); box-shadow: var(--shadow-up); transform: translateY(-1px); }
.status b { display: block; font: 700 10.5px var(--head); color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.legs { display: grid; grid-template-columns: 1.16fr .98fr 1.36fr; gap: 12px; margin: 0 0 14px; align-items: start; }
.leg { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 13px 9px;
  box-shadow: var(--shadow); }
.leg h3 { margin: 0 0 6px; font-size: 15px; letter-spacing: -.01em; display: flex; align-items: center; }
.leg h3 .no { display: inline-flex; width: 22px; height: 22px; border-radius: 7px;
  background: linear-gradient(135deg, var(--accent) 0%, #6D5BD0 100%); color: #FFFFFF; align-items: center;
  justify-content: center; font-size: 11px; margin-right: 9px; box-shadow: 0 2px 6px rgba(67, 56, 202, .28); }
.leg .sub { color: var(--faint); font: 700 10px var(--head); text-transform: uppercase; letter-spacing: .07em;
  margin: 6px 0 1px; padding-top: 5px; border-top: 1px solid var(--soft); }
.fig { display: grid; grid-template-columns: minmax(0, 1fr) 36px 88px; gap: 6px; padding: 0 4px; border-radius: 5px;
  line-height: 1.25; align-items: center; min-height: 17px; }
.cols { display: grid; grid-template-columns: 1.1fr 1fr; gap: 0 12px; } .cols .fig { grid-template-columns: minmax(0, 1fr) 0 84px; gap: 4px; }
.fig .fl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; }
.fig .fn, .fig .fu { text-align: right; } .fig .fn { color: var(--muted); }
.fig .fu { font-weight: 600; }
.fig.link { cursor: pointer; transition: background .12s; } .fig.link:hover, .fig.link:focus-visible { background: var(--accent-soft); }
.fig.plain .fl span { color: var(--muted); }
.fig.wrong .fu { color: var(--bad); }
.leg .note { color: var(--muted); font-size: 11.5px; margin: 3px 4px 0; line-height: 1.3; }

/* Waterfall: one row per step; the bar floats from where the walk stands to where it goes */
.wf { margin: 0 0 6px; }
.wf .wt { display: flex; align-items: center; font: 700 11px var(--head); color: var(--muted); margin: 0 0 3px; }
.wrow { display: grid; grid-template-columns: minmax(0, 2.1fr) minmax(0, 1fr) 80px; gap: 0 8px; align-items: center;
  padding: 0 4px; border-radius: 5px; min-height: 19px; }
.wrow.link { cursor: pointer; transition: background .12s; } .wrow.link:hover, .wrow.on { background: var(--accent-soft); }
.wrow .wl { display: flex; align-items: center; min-width: 0; line-height: 1.2; }
.wrow .wl .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wrow .wl .c { color: var(--faint); font-size: 11px; margin-left: 5px; white-space: nowrap; }
.wrow.total .wl .t { font-weight: 700; }
.wrow svg { width: 100%; height: 14px; display: block; overflow: visible; }
.wrow .wamt { text-align: right; white-space: nowrap; font-weight: 600; }
.wrow.t-wrong .wamt { color: var(--bad); } .wrow.t-ties .wamt { color: var(--good); }
.wrow .wnote { grid-column: 1 / -1; color: var(--muted); font-size: 11px; margin: -2px 0 2px; line-height: 1.25; }
.wf .tie-line { font-size: 11.5px; margin: 3px 4px 0; font-weight: 600; }
.wf .tie-line.ok { color: var(--good); } .wf .tie-line.bad { color: var(--bad); }
.wbar.total { fill: var(--night-2); } .wbar.wrong { fill: var(--bad); } .wbar.fix { fill: var(--accent); }
.wbar.waiting { fill: var(--card); stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 3 2; }
.wbar.owed { fill: var(--faint); } .wbar.ties { fill: var(--good); }
.wlink { stroke: var(--faint); stroke-width: 1; stroke-dasharray: 2 2; }
.wbreak { stroke: var(--card); stroke-width: 3; }

/* The payable bridge */
.bridge { width: 100%; font-size: 12px; border-collapse: collapse; margin-top: 2px; table-layout: fixed; }
.bridge th { position: static; white-space: normal; font: 700 10.5px var(--body); text-align: right; padding: 0 4px 2px;
  background: none; color: var(--muted); vertical-align: bottom; border: 0; letter-spacing: 0; }
.bridge th:first-child, .bridge td:first-child { width: 56%; text-align: left; white-space: normal; overflow-wrap: anywhere; }
.bridge td { padding: 0 4px; line-height: 1.2; border-bottom: 1px solid var(--soft); }
.bridge td.num { text-align: right; font-weight: 600; }
.bridge tr:last-child td { border-bottom: 0; font-weight: 700; }
.bridge td.link { cursor: pointer; } .bridge td.link.on { background: var(--accent-soft); color: var(--accent); }
.btitle { font: 700 11px var(--head); color: var(--muted); margin: 8px 0 1px; display: flex; align-items: center; }
.owed { margin-top: 12px; } .owed h3 { margin: 6px 0 4px; font-size: 13px; }

/* Below the legs */
.stack { display: grid; gap: 12px; align-content: start; }
tr.pick { cursor: pointer; }
.compact h3 { margin: 0 0 4px; font-size: 14px; }
.compact .said { color: var(--muted); font-size: 11.5px; margin: 3px 2px 0; }
.compact h3 .muted { font: 400 11.5px var(--body); }
.compact table { font-size: 12px; line-height: 1.2; } .compact td, .compact th { padding: 3px 5px; }
.compact th { position: static; white-space: normal; vertical-align: bottom; background: none; }
.compact td:first-child { white-space: nowrap; }

/* Pending actions and drafts */
.drafts { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 12px; }
.draft { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 18px;
  box-shadow: var(--shadow); }
.draft h3 { margin: 0 0 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.draft pre { white-space: pre-wrap; font: 400 12px/1.55 var(--body); background: var(--soft); border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: 10px 12px; margin: 8px 0; }
.draft .actions { display: flex; gap: 8px; }
.lacks { margin: 0; padding-left: 18px; } .lacks li { margin: 2px 0; }
.lacks button { margin-left: 8px; padding: 3px 8px; font-size: 12px; }
.resolves { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 18px; background: var(--card);
  border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 20px 16px 24px; margin: 0 0 14px;
  box-shadow: var(--shadow); position: relative; overflow: hidden; }
.resolves::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
  background: linear-gradient(180deg, var(--bad) 0%, var(--accent) 100%); }
.resolves .big { font: 700 30px/1.1 var(--head); letter-spacing: -.02em; }
.resolves .part { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--bad); }
.resolves .part.timing { color: var(--accent); }
td.res .pill { margin-left: 6px; font-size: 10px; }
td .legs-of { display: block; color: var(--muted); font-size: 11px; font-weight: 400; }
td.res { font-weight: 600; }

/* Phone width: the grids stack, the header wraps */
@media screen and (max-width: 760px) {
  header { padding: 10px 16px 0; }
  header .top { flex-direction: column; gap: 2px; }
  header .meta { white-space: normal; }
  main { padding: 14px 16px 12px; }
  .strip, .legs, .cols { grid-template-columns: minmax(0, 1fr); }
  .leg { overflow-x: auto; }
  .drafts { grid-template-columns: 1fr; }
  .resolves .big { font-size: 24px; }
}

@media print {
  body { background: #FFFFFF; font-size: 11px; }
  header { border: 0; padding: 0 0 6px; background: none; box-shadow: none; }
  header h1 { color: var(--ink); } header h1 .period, header .line, header .meta { color: var(--muted); }
  .wrap, .filters, .banner, .resolves { box-shadow: none; } nav, button.i, .filters, button:not(.link), .switch { display: none !important; }
  main { padding: 0; }
  .wrap, .summary { max-height: none !important; overflow: visible; border: 0; }
  th { position: static; } tfoot td { position: static; }
  .leg, .status, .card, .draft { break-inside: avoid; box-shadow: none; }
  .legs { grid-template-columns: 1fr 1fr 1.35fr; }
  .tip { display: none; }
}
</style>
</head>
<body>
<header>
  <div class="top">
    <div><h1>Project Bridge<span class="period" id="period"></span></h1>
      <p class="line">Case study by Andrés Molina &mdash; not a Clara product. Nothing here is posted; every entry is a proposal.</p></div>
    <p class="meta" id="meta"></p>
  </div>
  <nav id="tabs" role="tablist"></nav>
</header>
<main>
  <div id="warn" class="banner" hidden></div>
  <div id="missing" class="banner info" hidden></div>
  <div id="panels"></div>
  <footer>Amounts are shown exactly as computed, from decimal text. Fonts: DM Sans and Inter (SIL Open Font License),
    embedded in this file.</footer>
</main>
<script type="application/json" id="bridge-data">__BRIDGE_DATA__</script>
<script>
(function () {
  "use strict";
  var data = JSON.parse(document.getElementById("bridge-data").textContent);
  var T = data.tables, PAGE = data.page, totals = data.manifest.totals, OV = PAGE.overview;

  // Plain-English labels: the only place type, class and leg codes are translated.
  var CLASS_LABEL = { real_error: "Real error", timing: "Timing difference", data_issue: "Data issue",
                      auto_cleared: "Rounding (cleared)" };
  var CLASS_ORDER = ["real_error", "timing", "data_issue"];
  var LEG_LABEL = { "1": "Leg 1: processor vs Mastercard", "2": "Leg 2: Mastercard settlement vs bank",
                    "3": "Leg 3: bank and processor vs ledger" };
  var TYPE_LABEL = {
    month_cutoff: "Month cut-off", processor_entry_misdated: "Processor entry on wrong date",
    funding_in_transit: "Funding in transit", settlement_not_debited: "Settlement not yet debited",
    suspense_pending_payer: "Suspense, payer pending", processor_duplicate: "Duplicate in processor",
    bank_duplicate_debit: "Duplicate bank debit", sign_flip: "Sign flipped", amount_diff: "Amount differs",
    fx_rate_diff: "FX rate differs", processor_only: "Only in processor", mastercard_only: "Only in Mastercard",
    processor_entry_missing: "Processor ledger entry missing", invoice_not_accrued: "Invoice not accrued",
    settlement_amount_diff: "Settlement amount differs", usd_conversion_error: "USD conversion error",
    ledger_amount_diff: "Ledger amount differs from bank", ledger_posted_late: "Posted after the period end, move it back",
    bank_not_yet_posted: "In the ledger, bank not yet posted",
    bank_line_unrecorded: "Bank line not in ledger", ledger_entry_unmatched: "Ledger entry without bank line",

      Object.keys(pressed).forEach(function (k) { pressed[k].setAttribute("aria-pressed", pressed[k].getAttribute("data-tab") === tab ? "true" : "false"); });
      drawMain(); drawSource();
    }

      var b = el("button", { text: k[0], "data-tab": k[1] });
      b.addEventListener("click", function () { tab = k[1]; choice = null; draw(); });

    draw();

  }

    el("span", { "class": "lab", text: lab })]); }

    var section = el("section", { role: "tabpanel" });

  });

  closeScreen = closePanel(panels.Close);

  go("Summary");
